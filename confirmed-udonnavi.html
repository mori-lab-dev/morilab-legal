<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うどんナビ メールアドレスの確認 — MORI LAB</title>
<link rel="stylesheet" href="styles.css">
<style>
.done {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px 24px;
  margin: 24px 0;
  text-align: center;
}
.done .mark { font-size: 40px; line-height: 1; margin-bottom: 12px; }
.done h2 { margin: 0 0 8px; font-size: 19px; color: var(--fg); }
.done p { margin: 0 0 20px; font-size: 15px; color: var(--muted); line-height: 1.8; }
.open-btn {
  display: inline-block;
  padding: 13px 28px;
  border-radius: 8px;
  background: #1f6feb;
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
}
.app-name {
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--muted);
  margin: 24px 0 0;
}
/* 句のまとまりで折り返す。日本語は文字単位で折れるので、
   放っておくと「…なりまし / た。」のように1文字だけ落ちる。 */
.ph { display: inline-block; }
.done p, .hint { text-wrap: balance; }
.hint { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.8; }

#recovery input {
  display: block; width: 100%; box-sizing: border-box;
  padding: 12px; margin: 0 0 10px;
  font-size: 16px; border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg); color: var(--fg);
}
.rule { font-size: 12px; color: var(--muted); margin: 0 0 16px; text-align: left; }
.rule.ok { color: #1a7f37; }
</style>
</head>
<body>
<main class="container">
  <p class="app-name">うどんナビ</p>
  <div class="done" id="confirmed">
    <div class="mark">✓</div>
    <h2>メールアドレスを確認しました</h2>
    <p><span class="ph">うどんナビ に</span><span class="ph">ログインできるようになりました。</span><br><span class="ph">アプリに戻って</span><span class="ph">「ログイン」を選んでください。</span></p>
    <a class="open-btn" href="udonnavi://">うどんナビ を開く</a>
    <p class="hint"><span class="ph">ボタンでアプリが開かないときは、</span><span class="ph">ホーム画面から うどんナビ を起動してください。</span><br><span class="ph">パソコンでこのページを開いた場合は、</span><span class="ph">iPhone の うどんナビ からログインできます。</span></p>
  </div>
  <p style="font-size:13px;color:var(--muted);"><span class="ph">このページは うどんナビ の</span><span class="ph">メールアドレス確認用です。</span><span class="ph">心当たりがない場合は、</span><span class="ph">そのまま閉じていただいて構いません。</span></p>

  <!-- パスワード再設定。メールのリンクは #type=recovery で戻ってくる。 -->
  <div id="recovery" class="done" hidden>
    <h2>新しいパスワードを決めてください</h2>
    <p><span class="ph">うどんナビ にログインするための</span><span class="ph">新しいパスワードを入力します。</span></p>
    <input id="pw1" type="password" placeholder="新しいパスワード" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="もう一度入力" autocomplete="new-password">
    <p id="rule" class="rule">6文字以上</p>
    <button id="save" class="open-btn" type="button">パスワードを変更する</button>
    <p id="rmsg" class="hint"></p>
  </div>
</main>

<script>
(function () {
  var SB  = "https://ijoclqpnbnkxwrylsgqq.supabase.co";
  var KEY = "sb_publishable_h34IOs7IzlwJDrr2iMuz8w_1J4jutti";
  var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  var type  = hash.get("type");
  var token = hash.get("access_token");

  // パスワード再設定のリンクから来たときだけ、確認メッセージを再設定の画面に差し替える。
  if (type !== "recovery" || !token) return;
  document.getElementById("confirmed").hidden = true;
  document.getElementById("recovery").hidden = false;

  var pw1 = document.getElementById("pw1");
  var pw2 = document.getElementById("pw2");
  var rule = document.getElementById("rule");
  var msg = document.getElementById("rmsg");
  var save = document.getElementById("save");

  function check() {
    var ok = pw1.value.length >= 6;
    rule.textContent = ok ? "✓ 6文字以上" : "6文字以上";
    rule.className = ok ? "rule ok" : "rule";
    if (pw2.value && pw1.value !== pw2.value) {
      msg.textContent = "2つのパスワードが一致していません";
    } else {
      msg.textContent = "";
    }
  }
  pw1.addEventListener("input", check);
  pw2.addEventListener("input", check);

  save.addEventListener("click", function () {
    if (pw1.value.length < 6) { msg.textContent = "6文字以上にしてください"; return; }
    if (pw1.value !== pw2.value) { msg.textContent = "2つのパスワードが一致していません"; return; }
    save.disabled = true;
    msg.textContent = "変更しています…";
    fetch(SB + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: pw1.value })
    }).then(function (r) {
      if (r.ok) {
        document.getElementById("recovery").innerHTML =
          '<div class="mark">✓</div><h2>パスワードを変更しました</h2>' +
          '<p><span class="ph">新しいパスワードで</span><span class="ph">うどんナビ にログインできます。</span></p>' +
          '<a class="open-btn" href="udonnavi://">うどんナビ を開く</a>';
        return;
      }
      return r.json().then(function (e) {
        save.disabled = false;
        msg.textContent = "変更できませんでした。" +
          "リンクの有効期限が切れている場合は、アプリからもう一度お試しください。";
        if (e && e.msg) { console.log(e.msg); }
      });
    }).catch(function () {
      save.disabled = false;
      msg.textContent = "通信に失敗しました。電波の良い場所でもう一度お試しください。";
    });
  });
})();
</script>
</body>
</html>
